<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireFlow AI - Candidate Screening & Interview Intelligence Dashboard</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        },
                        dark: {
                            800: '#1e293b',
                            850: '#172033',
                            900: '#0f172a',
                            950: '#090d16',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React 18 & Babel Standalone -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const API_BASE = window.location.origin;

        // Tier styling helpers
        const TIER_CONFIG = {
            TIER_1_SHORTLIST: {
                label: 'Tier 1 (Shortlist)',
                badge: 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30',
                cardBorder: 'border-emerald-500/40 hover:border-emerald-400',
                scoreBg: 'bg-emerald-500 text-white',
                dot: 'bg-emerald-400',
            },
            TIER_2_CONTENDER: {
                label: 'Tier 2 (Contender)',
                badge: 'bg-blue-500/20 text-blue-400 border border-blue-500/30',
                cardBorder: 'border-blue-500/40 hover:border-blue-400',
                scoreBg: 'bg-blue-500 text-white',
                dot: 'bg-blue-400',
            },
            TIER_3_SPECIALIST_GAPPED: {
                label: 'Tier 3 (Specialist / Gapped)',
                badge: 'bg-amber-500/20 text-amber-400 border border-amber-500/30',
                cardBorder: 'border-amber-500/40 hover:border-amber-400',
                scoreBg: 'bg-amber-500 text-white',
                dot: 'bg-amber-400',
            },
            TIER_4_UNMATCHED: {
                label: 'Tier 4 (Unmatched)',
                badge: 'bg-rose-500/20 text-rose-400 border border-rose-500/30',
                cardBorder: 'border-rose-500/40 hover:border-rose-400',
                scoreBg: 'bg-rose-500 text-white',
                dot: 'bg-rose-400',
            }
        };

        const MATCH_LEVEL_BADGES = {
            EXCEEDS: 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30',
            MEETS: 'bg-blue-500/20 text-blue-300 border border-blue-500/30',
            PARTIAL: 'bg-amber-500/20 text-amber-300 border border-amber-500/30',
            INSUFFICIENT: 'bg-rose-500/20 text-rose-300 border border-rose-500/30',
            NOT_FOUND: 'bg-slate-700/50 text-slate-400 border border-slate-600/30',
        };

        function App() {
            const [activeTab, setActiveTab] = useState('leaderboard');
            const [poolData, setPoolData] = useState(null);
            const [selectedCandidate, setSelectedCandidate] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            // Filter states
            const [selectedTier, setSelectedTier] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');
            const [minScore, setMinScore] = useState(0);

            // Query Tab State
            const [nlPrompt, setNlPrompt] = useState('');
            const [queryLoading, setQueryLoading] = useState(false);
            const [queryResponse, setQueryResponse] = useState(null);

            // Post-Interview Audit State
            const [auditCandidateId, setAuditCandidateId] = useState('');
            const [auditNotesText, setAuditNotesText] = useState('');
            const [auditLoading, setAuditLoading] = useState(false);
            const [auditResult, setAuditResult] = useState(null);

            // Upload Modal State
            const [isUploadOpen, setIsUploadOpen] = useState(false);
            const [uploading, setUploading] = useState(false);

            // Fetch pool on mount
            const fetchPool = async () => {
                try {
                    setLoading(true);
                    const res = await fetch(`${API_BASE}/api/v1/pool`);
                    const data = await res.json();
                    setPoolData(data);
                    if (data.candidates && data.candidates.length > 0 && !selectedCandidate) {
                        setSelectedCandidate(data.candidates[0]);
                        setAuditCandidateId(data.candidates[0].candidate_id);
                    }
                    setError(null);
                } catch (err) {
                    setError('Failed to connect to HireFlow API. Please ensure server is running.');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchPool();
            }, []);

            // Toast helper
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 4000);
            };

            // Load Demo Dataset
            const handleLoadDemo = async () => {
                try {
                    setLoading(true);
                    const res = await fetch(`${API_BASE}/api/v1/demo/load`, { method: 'POST' });
                    const result = await res.json();
                    if (res.ok) {
                        showToast('⚡ Demo dataset loaded: 4 candidates & Senior Distributed Systems role');
                        await fetchPool();
                    } else {
                        showToast(`Error: ${result.detail}`);
                    }
                } catch (err) {
                    showToast('Failed to load demo data.');
                } finally {
                    setLoading(false);
                }
            };

            // Execute Natural Language Query
            const handleNlQuery = async (queryText) => {
                const text = queryText || nlPrompt;
                if (!text.trim()) return;
                try {
                    setQueryLoading(true);
                    const res = await fetch(`${API_BASE}/api/v1/query`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: text, top_k: 5 }),
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setQueryResponse(data);
                    } else {
                        showToast(data.detail || 'Query failed.');
                    }
                } catch (err) {
                    showToast('Network error querying candidate pool.');
                } finally {
                    setQueryLoading(false);
                }
            };

            // Execute Interview Coverage Audit
            const handleAuditInterview = async () => {
                if (!auditCandidateId || !auditNotesText.trim()) {
                    showToast('Please select a candidate and enter interview notes.');
                    return;
                }
                try {
                    setAuditLoading(true);
                    const res = await fetch(`${API_BASE}/api/v1/evaluate-interview-raw`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            candidate_id: auditCandidateId,
                            notes_text: auditNotesText,
                        }),
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setAuditResult(data);
                        showToast('✅ Interview evaluation completed with coverage analysis!');
                    } else {
                        showToast(data.detail || 'Evaluation failed.');
                    }
                } catch (err) {
                    showToast('Error auditing interview notes.');
                } finally {
                    setAuditLoading(false);
                }
            };

            // Filtered Candidates
            const filteredCandidates = useMemo(() => {
                if (!poolData || !poolData.candidates) return [];
                return poolData.candidates.filter(c => {
                    if (selectedTier !== 'ALL' && c.assigned_tier !== selectedTier) return false;
                    if (c.overall_match_score < minScore) return false;
                    if (searchQuery.trim()) {
                        const q = searchQuery.toLowerCase();
                        const matchName = c.candidate_name.toLowerCase().includes(q);
                        const matchTags = c.capability_tags.some(t => t.toLowerCase().includes(q));
                        const matchStrengths = c.strengths.some(s => s.toLowerCase().includes(q));
                        if (!matchName && !matchTags && !matchStrengths) return false;
                    }
                    return true;
                });
            }, [poolData, selectedTier, searchQuery, minScore]);

            // Quick Stats
            const stats = useMemo(() => {
                if (!poolData || !poolData.candidates || poolData.candidates.length === 0) {
                    return { total: 0, tier1: 0, avgScore: 0 };
                }
                const total = poolData.candidates.length;
                const tier1 = poolData.candidates.filter(c => c.assigned_tier === 'TIER_1_SHORTLIST').length;
                const avg = (poolData.candidates.reduce((acc, c) => acc + c.overall_match_score, 0) / total).toFixed(1);
                return { total, tier1, avgScore: avg };
            }, [poolData]);

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header Bar */}
                    <header className="border-b border-slate-800/80 bg-dark-900/90 backdrop-blur sticky top-0 z-40 px-6 py-3.5">
                        <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center space-x-3">
                                <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                                    <span className="text-xl font-black text-white tracking-wider">H</span>
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <h1 className="text-xl font-bold bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">
                                            HireFlow AI
                                        </h1>
                                        <span className="text-xs px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-300 border border-brand-500/30 font-semibold">
                                            v1.0 Pro
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400">
                                        {poolData?.job?.title ? `Role: ${poolData.job.title}` : 'AI Screening & Interview Intelligence'}
                                    </p>
                                </div>
                            </div>

                            {/* Quick Stats Pill */}
                            {poolData && poolData.candidates && poolData.candidates.length > 0 && (
                                <div className="hidden md:flex items-center space-x-6 px-4 py-1.5 rounded-xl bg-dark-850 border border-slate-800 text-xs">
                                    <div>
                                        <span className="text-slate-400">Pool Size: </span>
                                        <strong className="text-white font-bold">{stats.total} candidates</strong>
                                    </div>
                                    <div className="h-3 w-px bg-slate-700"></div>
                                    <div>
                                        <span className="text-slate-400">Shortlisted (T1): </span>
                                        <strong className="text-emerald-400 font-bold">{stats.tier1}</strong>
                                    </div>
                                    <div className="h-3 w-px bg-slate-700"></div>
                                    <div>
                                        <span className="text-slate-400">Avg Score: </span>
                                        <strong className="text-brand-400 font-bold">{stats.avgScore}%</strong>
                                    </div>
                                </div>
                            )}

                            {/* Actions */}
                            <div className="flex items-center space-x-3">
                                <button
                                    onClick={handleLoadDemo}
                                    className="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center space-x-1.5 transition-all shadow-sm"
                                >
                                    <span>⚡ Load Demo Data</span>
                                </button>
                                <a
                                    href="/docs"
                                    target="_blank"
                                    rel="noreferrer"
                                    className="px-3 py-1.5 text-xs font-medium rounded-lg bg-dark-850 hover:bg-dark-800 text-slate-400 hover:text-slate-200 border border-slate-800 transition-all"
                                >
                                    API Docs
                                </a>
                            </div>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl bg-dark-800 border border-brand-500/40 text-sm shadow-2xl flex items-center space-x-3 animate-bounce">
                            <span className="h-2.5 w-2.5 rounded-full bg-brand-400"></span>
                            <span className="text-slate-100 font-medium">{toastMessage}</span>
                        </div>
                    )}

                    {/* Navigation Tabs */}
                    <div className="border-b border-slate-800 bg-dark-900/50 px-6">
                        <div className="max-w-7xl mx-auto flex space-x-1 overflow-x-auto py-2">
                            {[
                                { id: 'leaderboard', label: '📊 Candidate Leaderboard', count: poolData?.candidates?.length },
                                { id: 'scorecard', label: '👤 Candidate Scorecard', disabled: !selectedCandidate },
                                { id: 'interview_guide', label: '🎯 Interview Plan & Probe Trees', disabled: !selectedCandidate },
                                { id: 'coverage_audit', label: '📋 Post-Interview Notes Auditor' },
                                { id: 'nl_query', label: '🔍 Natural Language Talent Query' },
                                { id: 'provenance', label: '🛡️ Audit Provenance Ledger', disabled: !selectedCandidate },
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    disabled={tab.disabled}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center space-x-2 ${
                                        activeTab === tab.id
                                            ? 'bg-brand-600 text-white shadow-md shadow-brand-600/30'
                                            : tab.disabled
                                            ? 'text-slate-600 cursor-not-allowed'
                                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                                    }`}
                                >
                                    <span>{tab.label}</span>
                                    {tab.count !== undefined && tab.count > 0 && (
                                        <span className={`px-1.5 py-0.2 rounded-full text-[10px] ${activeTab === tab.id ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                            {tab.count}
                                        </span>
                                    )}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Container */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-6">
                        {loading && (
                            <div className="flex flex-col items-center justify-center py-24 space-y-4">
                                <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-brand-500"></div>
                                <p className="text-sm text-slate-400">Processing candidates with HireFlow Intelligence...</p>
                            </div>
                        )}

                        {error && !loading && (
                            <div className="p-6 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm">
                                <h3 className="font-bold text-base mb-1">Service Disconnected</h3>
                                <p>{error}</p>
                            </div>
                        )}

                        {!loading && poolData && poolData.candidates.length === 0 && (
                            <div className="text-center py-20 bg-dark-900/40 rounded-2xl border border-dashed border-slate-800 p-8">
                                <div className="h-14 w-14 rounded-2xl bg-brand-500/10 border border-brand-500/20 text-brand-400 flex items-center justify-center mx-auto mb-4 text-2xl">
                                    📂
                                </div>
                                <h3 className="text-lg font-bold text-slate-200">No Candidates in Screening Pool</h3>
                                <p className="text-sm text-slate-400 max-w-md mx-auto mt-1 mb-6">
                                    Click below to load the built-in sample dataset (Senior Distributed Systems Role + 4 Candidate profiles) to immediately test the platform.
                                </p>
                                <button
                                    onClick={handleLoadDemo}
                                    className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm shadow-lg shadow-brand-500/20 transition-all inline-flex items-center space-x-2"
                                >
                                    <span>⚡ Load Sample Screening Pool</span>
                                </button>
                            </div>
                        )}

                        {!loading && poolData && poolData.candidates.length > 0 && (
                            <>
                                {/* TAB 1: LEADERBOARD */}
                                {activeTab === 'leaderboard' && (
                                    <div className="space-y-6">
                                        {/* Tier Summary Cards */}
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                            {[
                                                { tier: 'TIER_1_SHORTLIST', title: 'Tier 1 Shortlist', color: 'emerald', desc: '≥85% Score, 0 must-have deficits' },
                                                { tier: 'TIER_2_CONTENDER', title: 'Tier 2 Contenders', color: 'blue', desc: '70-84% Score, competitive match' },
                                                { tier: 'TIER_3_SPECIALIST_GAPPED', title: 'Tier 3 Specialist', color: 'amber', desc: 'High domain fit, core criteria gap' },
                                                { tier: 'TIER_4_UNMATCHED', title: 'Tier 4 Unmatched', color: 'rose', desc: '<70% Score or missing criteria' },
                                            ].map(t => {
                                                const count = poolData.tier_distribution[t.tier] || 0;
                                                const isSelected = selectedTier === t.tier;
                                                return (
                                                    <div
                                                        key={t.tier}
                                                        onClick={() => setSelectedTier(isSelected ? 'ALL' : t.tier)}
                                                        className={`p-4 rounded-xl cursor-pointer transition-all border bg-dark-900/60 ${
                                                            isSelected
                                                                ? `border-${t.color}-500 ring-2 ring-${t.color}-500/30 bg-dark-850`
                                                                : 'border-slate-800 hover:border-slate-700'
                                                        }`}
                                                    >
                                                        <div className="flex justify-between items-center mb-1">
                                                            <span className="text-xs font-medium text-slate-400">{t.title}</span>
                                                            <span className={`h-2.5 w-2.5 rounded-full bg-${t.color}-400`}></span>
                                                        </div>
                                                        <div className="text-2xl font-black text-white">{count}</div>
                                                        <div className="text-[11px] text-slate-500 mt-1 truncate">{t.desc}</div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* Filter Controls */}
                                        <div className="flex flex-wrap items-center justify-between gap-4 p-4 rounded-xl bg-dark-900 border border-slate-800">
                                            <div className="flex flex-wrap items-center gap-3 flex-1 min-w-[280px]">
                                                <input
                                                    type="text"
                                                    value={searchQuery}
                                                    onChange={e => setSearchQuery(e.target.value)}
                                                    placeholder="Search by candidate name, tags, or skills..."
                                                    className="px-3.5 py-2 rounded-lg bg-dark-950 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 flex-1 min-w-[200px]"
                                                />
                                                <select
                                                    value={selectedTier}
                                                    onChange={e => setSelectedTier(e.target.value)}
                                                    className="px-3 py-2 rounded-lg bg-dark-950 border border-slate-700 text-xs text-slate-300 focus:outline-none focus:border-brand-500"
                                                >
                                                    <option value="ALL">All Tiers ({poolData.candidates.length})</option>
                                                    <option value="TIER_1_SHORTLIST">Tier 1: Shortlist</option>
                                                    <option value="TIER_2_CONTENDER">Tier 2: Contender</option>
                                                    <option value="TIER_3_SPECIALIST_GAPPED">Tier 3: Specialist</option>
                                                    <option value="TIER_4_UNMATCHED">Tier 4: Unmatched</option>
                                                </select>
                                            </div>

                                            <div className="flex items-center space-x-3 text-xs text-slate-400">
                                                <span>Min Match Score: <strong className="text-brand-400">{minScore}%</strong></span>
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="90"
                                                    step="5"
                                                    value={minScore}
                                                    onChange={e => setMinScore(Number(e.target.value))}
                                                    className="w-24 accent-brand-500"
                                                />
                                            </div>
                                        </div>

                                        {/* Leaderboard Table */}
                                        <div className="rounded-2xl border border-slate-800 bg-dark-900/60 overflow-hidden shadow-xl">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="border-b border-slate-800 bg-dark-850/50 text-[11px] uppercase tracking-wider text-slate-400">
                                                        <th className="py-3.5 px-4 font-semibold text-center w-14">Rank</th>
                                                        <th className="py-3.5 px-4 font-semibold">Candidate Profile</th>
                                                        <th className="py-3.5 px-4 font-semibold text-center">Score</th>
                                                        <th className="py-3.5 px-4 font-semibold">Tier Status</th>
                                                        <th className="py-3.5 px-4 font-semibold">Top Strength</th>
                                                        <th className="py-3.5 px-4 font-semibold">Flagged Risks / Gaps</th>
                                                        <th className="py-3.5 px-4 font-semibold text-right">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800/60 text-xs">
                                                    {filteredCandidates.map((cand, idx) => {
                                                        const cfg = TIER_CONFIG[cand.assigned_tier] || TIER_CONFIG.TIER_4_UNMATCHED;
                                                        const isSel = selectedCandidate?.candidate_id === cand.candidate_id;
                                                        const profile = poolData?.profiles?.[cand.candidate_id];
                                                        return (
                                                            <tr
                                                                key={cand.candidate_id}
                                                                onClick={() => setSelectedCandidate(cand)}
                                                                className={`cursor-pointer transition-colors ${
                                                                    isSel ? 'bg-brand-600/10' : 'hover:bg-slate-800/40'
                                                                }`}
                                                            >
                                                                <td className="py-4 px-4 text-center font-bold text-slate-400">
                                                                    #{idx + 1}
                                                                </td>
                                                                <td className="py-4 px-4">
                                                                    <div className="font-bold text-white text-sm">{cand.candidate_name}</div>
                                                                    <div className="flex flex-wrap gap-1 mt-1">
                                                                        {cand.capability_tags.slice(0, 2).map(tag => (
                                                                            <span key={tag} className="px-1.5 py-0.5 rounded bg-slate-800 text-[10px] text-slate-300">
                                                                                {tag}
                                                                            </span>
                                                                        ))}
                                                                        {profile && (
                                                                            <span className="px-1.5 py-0.5 rounded bg-slate-800/60 text-[10px] text-slate-400">
                                                                                {profile.total_years_experience} yrs exp
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                </td>
                                                                <td className="py-4 px-4 text-center">
                                                                    <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold ${cfg.scoreBg}`}>
                                                                        {cand.overall_match_score.toFixed(1)}%
                                                                    </span>
                                                                </td>
                                                                <td className="py-4 px-4">
                                                                    <span className={`inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-semibold ${cfg.badge}`}>
                                                                        <span className={`h-1.5 w-1.5 rounded-full ${cfg.dot} mr-1.5`}></span>
                                                                        {cfg.label}
                                                                    </span>
                                                                </td>
                                                                <td className="py-4 px-4 max-w-xs truncate text-slate-300">
                                                                    {cand.strengths[0] ? `✅ ${cand.strengths[0]}` : '—'}
                                                                </td>
                                                                <td className="py-4 px-4 max-w-xs truncate text-rose-300/90">

                                                        <div className="text-slate-400 text-[11px]">Section: <span className="text-slate-200 capitalize">{cit.section}</span> | Confidence: {(cit.confidence * 100).toFixed(0)}%</div>
                                                        <p className="text-slate-200 italic mt-1 font-mono">"{cit.verbatim_quote}"</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-slate-800/80 bg-dark-950 py-4 px-6 text-center text-xs text-slate-500">
                        HireFlow AI Talent Intelligence Platform • Built with FastAPI, React & Anthropic Claude
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hireflow"
version = "1.0.0"
description = "AI Candidate Screening & Interview Intelligence Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "HireFlow Team" }
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "anthropic>=0.18.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "rich>=13.7.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "gunicorn>=21.2.0",
]

[project.scripts]
hireflow = "hireflow.api.cli:main"

[tool.setuptools.packages.find]
include = ["hireflow*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

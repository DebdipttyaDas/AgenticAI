services:
  - type: web
    name: hireflow
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn hireflow.api.routes:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HIREFLOW_PRIMARY_MODEL
        value: claude-3-5-sonnet-20241022
      - key: HIREFLOW_FAST_MODEL
        value: claude-3-5-haiku-20241022
